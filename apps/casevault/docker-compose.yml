# Case Vault production stack: Postgres + web + worker + Caddy (automatic HTTPS).
# Guide (Vietnamese): docs/DEPLOY_CASEVAULT.md. Secrets: ./.env (never committed).
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: casevault
      POSTGRES_USER: casevault
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U casevault"]
      interval: 10s
      retries: 5

  web:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://casevault:${POSTGRES_PASSWORD}@db:5432/casevault
    volumes: [./data:/app/data, ./config:/app/config:ro]   # edit config/casevault.yaml + restart
    depends_on:
      db: {condition: service_healthy}

  worker:   # outbox (Klaviyo/Telegram/coupons) every minute, pending Etsy/Shopify re-check every 30 min
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://casevault:${POSTGRES_PASSWORD}@db:5432/casevault
    volumes: [./data:/app/data, ./config:/app/config:ro]   # edit config/casevault.yaml + restart
    command: ["python", "-m", "casevault", "worker"]
    depends_on:
      db: {condition: service_healthy}

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    profiles: ["caddy"]          # skip when using Cloudflare Tunnel
    ports: ["80:80", "443:443"]
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on: [web]

  tunnel:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    profiles: ["tunnel"]         # alternative to Caddy: no open ports, runs on the home VM
    command: ["tunnel", "--no-autoupdate", "run", "--token", "${CLOUDFLARE_TUNNEL_TOKEN}"]
    depends_on: [web]

volumes:
  pgdata:
  caddy_data:

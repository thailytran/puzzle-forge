[project]
name = "casevault"
version = "0.2.0"
description = "Case Vault: final-answer check, proof of purchase and rewards for Puzzle Forge books"
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "sqlalchemy>=2.0",
    "pg8000>=1.31",          # BSD-3 Postgres driver (psycopg is LGPL: not used)
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
    "pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["casevault"]

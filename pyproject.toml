[project]
name = "puzzle-forge"
version = "0.1.0"
description = "Print-ready puzzle books (classic + mystery) for Amazon KDP"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "pydantic>=2.7",
    "typer>=0.12",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "rich>=13.7",
    "typst>=0.14,<0.15",
    "pypdf>=4.0",
    "rustoku>=0.16,<0.17",
    "pypdfium2>=4.30",
    "pillow>=10",
    "cryptography>=42",
    "segno>=1.6",
    "anthropic>=1.0",
    "httpx>=0.27",
]

[project.scripts]
forge = "forge.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "hypothesis>=6.100",
    "ruff>=0.6",
    "mypy>=1.10",
    "types-pyyaml>=6.0",
    "casevault",
]

[tool.uv.sources]
casevault = { path = "apps/casevault", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["forge"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["B008"]  # typer uses function calls in defaults

[tool.ruff.lint.per-file-ignores]
"apps/casevault/**" = ["RUF001"]  # owner wording uses an en dash: "2/5 cases solved – 3 more"

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = ["forge/core", "forge/puzzles"]

[tool.pytest.ini_options]
testpaths = ["tests", "apps/casevault/tests"]
addopts = "-ra"
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient`"]
markers = [
    "typst: needs the typst CLI binary (skipped when missing)",
]

[[tool.mypy.overrides]]
module = ["rustoku", "rustoku.*", "typst"]
ignore_missing_imports = true

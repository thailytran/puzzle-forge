# Blueprint: CBN Mystery (owner spec §6.2, docs/MYSTERY_DESIGN.md §15-§16). Adult / family edition:
# 8 chapters x 5 pages (story, colour-by-number reveal, 2 side puzzles, evidence card) = 40 pages,
# 24 of them puzzle pages; plus how to play, suspects, code log, deduction, hints, solutions, Case Vault.
# Kids 6-8: 4 chapters, same page types with the *_kids variants (bigger zones, less text).
# Clues live only in puzzle / text / input zones (generated by code); art zones are illustration.
line: cbn_mystery
audience: adult
base_trim: "8.5x11"
binding_mm: 19
required: [inner_cover, how_to_play, dossier, code_register, story, cbn_reveal, side_puzzle,
           evidence_card, deduction, hints, solutions, case_vault]
chapter: [story, cbn_reveal, side_puzzle, side_puzzle, evidence_card]
common:
  - { name: header, kind: header, x: 19, y: 4,   w: 184, h: 8,  z: 5 }
  - { name: footer, kind: footer, x: 19, y: 263, w: 184, h: 12, z: 5 }
page_types:
  inner_cover:
    bare: true
    variants:
      default:
        - { name: cover_art, kind: art,  x: 0,  y: 0,  w: 215.9, h: 279.4, z: 0 }
        - { name: title,     kind: text, x: 25, y: 30, w: 166,   h: 50,    z: 10 }
  how_to_play:
    variants:
      default:
        - { name: rules, kind: text, x: 19, y: 15,  w: 184, h: 130, z: 10 }
        - { name: scene, kind: art,  x: 19, y: 150, w: 184, h: 105, z: 0 }
  dossier:
    variants:
      default:
        - { name: portraits, kind: art,  x: 19, y: 15, w: 184, h: 70,  z: 0 }
        - { name: profiles,  kind: text, x: 19, y: 90, w: 184, h: 168, z: 10 }
  code_register:
    variants:
      default:
        - { name: intro, kind: text,  x: 19, y: 15, w: 184, h: 20,  z: 10 }
        - { name: table, kind: input, x: 19, y: 40, w: 184, h: 218, z: 10 }
  story:
    variants:
      art_top:
        - { name: scene, kind: art,  x: 19, y: 15,  w: 184, h: 120, z: 0 }
        - { name: prose, kind: text, x: 19, y: 140, w: 184, h: 118, z: 10 }
      ink_saver:
        - { name: prose, kind: text, x: 19, y: 15, w: 184, h: 243, z: 10 }
      art_top_kids:
        - { name: scene, kind: art,  x: 19, y: 15,  w: 184, h: 150, z: 0 }
        - { name: prose, kind: text, x: 19, y: 170, w: 184, h: 88,  z: 10 }
  cbn_reveal:
    variants:
      default:
        - { name: intro,   kind: text,   x: 19, y: 15,  w: 184, h: 14,  z: 10 }
        - { name: mosaic,  kind: puzzle, x: 19, y: 32,  w: 184, h: 190, z: 10 }
        - { name: palette, kind: text,   x: 19, y: 225, w: 184, h: 14,  z: 10 }
        - { name: symbol,  kind: input,  x: 60, y: 242, w: 96,  h: 16,  z: 10 }
  side_puzzle:
    variants:
      default:
        - { name: intro,   kind: text,   x: 19, y: 15,  w: 184, h: 18,  z: 10 }
        - { name: game,    kind: puzzle, x: 19, y: 36,  w: 184, h: 196, z: 10 }
        - { name: keyword, kind: input,  x: 60, y: 236, w: 96,  h: 20,  z: 10 }
  evidence_card:
    variants:
      default:
        - { name: card,   kind: text, x: 19, y: 15,  w: 184, h: 150, z: 10 }
        - { name: object, kind: art,  x: 19, y: 170, w: 184, h: 88,  z: 0 }
      ink_saver:
        - { name: card, kind: text, x: 19, y: 15, w: 184, h: 243, z: 10 }
  deduction:
    variants:
      default:
        - { name: prose,    kind: text,  x: 19, y: 15,  w: 184, h: 60,  z: 10 }
        - { name: suspects, kind: input, x: 19, y: 80,  w: 184, h: 140, z: 10 }
        - { name: answer,   kind: input, x: 40, y: 226, w: 136, h: 30,  z: 10 }
  hints:
    variants:
      default:
        - { name: tiers, kind: text, x: 19, y: 15, w: 184, h: 243, z: 10 }
  solutions:
    variants:
      default:
        - { name: answers, kind: puzzle, x: 19, y: 15, w: 184, h: 243, z: 10 }
  case_vault:
    variants:
      default:
        - { name: prose, kind: text,  x: 19, y: 15,  w: 184, h: 110, z: 10 }
        - { name: code,  kind: input, x: 40, y: 135, w: 136, h: 40,  z: 10 }
        - { name: scene, kind: art,   x: 19, y: 182, w: 184, h: 76,  z: 0 }

name: Case Vault image (GHCR)

# Push a tag casevault-vX.Y.Z (same as apps/casevault/pyproject.toml version) -> tests -> image
# ghcr.io/<owner>/casevault:X.Y.Z (+ :latest). The package stays private when the repo is private.
on:
  push:
    tags: ["casevault-v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Version
        id: v
        run: |
          v=$(grep -m1 '^version' apps/casevault/pyproject.toml | cut -d'"' -f2)
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            test "casevault-v$v" = "${GITHUB_REF_NAME}" || { echo "tag != apps/casevault v$v"; exit 1; }
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/casevault" >> "$GITHUB_OUTPUT"
      - run: uv sync --locked
      - run: uv run pytest -q apps/casevault/tests tests/vault
      - uses: docker/setup-qemu-action@v3   # arm64 for Oracle Ampere A1
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: apps/casevault
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VERSION=${{ steps.v.outputs.version }}
            GIT_SHA=${{ github.sha }}
          tags: |
            ${{ steps.v.outputs.image }}:${{ steps.v.outputs.version }}
            ${{ steps.v.outputs.image }}:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.v.outputs.version }}

name: Release (Puzzle Forge)

# Push a tag vX.Y.Z (same as pyproject.toml version) -> tests -> source tarball + wheel -> GitHub Release.
# scripts/install.sh installs from a tag (git clone) or from the release tarball.
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    env:
      TYPST_VERSION: "0.14.2"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Tag must match pyproject version
        run: |
          v=$(grep -m1 '^version' pyproject.toml | cut -d'"' -f2)
          test "v$v" = "${GITHUB_REF_NAME}" || { echo "tag ${GITHUB_REF_NAME} != pyproject v$v"; exit 1; }
      - name: Install typst
        run: |
          curl -sSL "https://github.com/typst/typst/releases/download/v${TYPST_VERSION}/typst-x86_64-unknown-linux-musl.tar.xz" | tar -xJ -C /tmp
          sudo install -m 0755 /tmp/typst-x86_64-unknown-linux-musl/typst /usr/local/bin/typst
      - run: uv sync --locked
      - run: uv run ruff check . && uv run ruff format --check . && uv run mypy
      - run: uv run pytest -q
      - name: Build artifacts
        run: |
          uv build --wheel --out-dir dist
          name="puzzle-forge-${GITHUB_REF_NAME}"
          printf 'version=%s\nsha=%s\n' "${GITHUB_REF_NAME#v}" "$(git rev-parse --short HEAD)" > BUILD_INFO
          git archive --format=tar --prefix="$name/" HEAD > "dist/$name.tar"
          tar --append -f "dist/$name.tar" --transform "s,^,$name/," BUILD_INFO
          gzip -9 "dist/$name.tar"
          sha256sum dist/* > dist/SHA256SUMS
      - name: Release notes from CHANGELOG
        run: |
          v="${GITHUB_REF_NAME#v}"
          awk -v v="$v" '$0 ~ "^## \\[" v "\\]" {f=1; next} /^## \[/ {f=0} f' docs/CHANGELOG.md > notes.md
          test -s notes.md || echo "See docs/CHANGELOG.md" > notes.md
      - uses: softprops/action-gh-release@v2
        with:
          body_path: notes.md
          files: dist/*

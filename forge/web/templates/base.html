<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Puzzle Forge{% endblock %}</title>
<script src="https://unpkg.com/htmx.org@1.9.12" defer></script>
<style>
:root{--ink:#1b2430;--muted:#5b6675;--accent:#1F4E79;--bg:#f5f6f8;--card:#fff;--ok:#21633a;--warn:#8a5a00;--err:#a3262a}
*{box-sizing:border-box}body{margin:0;font:15px/1.45 system-ui,sans-serif;color:var(--ink);background:var(--bg)}
header{background:var(--accent);color:#fff;padding:10px 16px;display:flex;gap:16px;align-items:center;flex-wrap:wrap}
header a{color:#fff;text-decoration:none;font-weight:600}header .env{margin-left:auto;font-size:12px;opacity:.85}
.env-test{background:#8a5a00}.env-dev{background:#555}
main{max-width:1100px;margin:0 auto;padding:16px}
.card{background:var(--card);border-radius:8px;padding:16px;margin-bottom:14px;box-shadow:0 1px 2px rgba(0,0,0,.08)}
table{border-collapse:collapse;width:100%;font-size:14px}th,td{text-align:left;padding:5px 7px;border-bottom:1px solid #e4e7eb;vertical-align:top}
input,select,textarea{padding:7px;border:1px solid #c7ccd3;border-radius:5px;font:inherit;max-width:100%}
label{display:block;font-weight:600;margin:10px 0 3px}button{background:var(--accent);color:#fff;border:0;border-radius:5px;padding:8px 14px;cursor:pointer;font:inherit}
button.secondary{background:#e4e7eb;color:var(--ink)}.ok{color:var(--ok)}.warn{color:var(--warn)}.err{color:var(--err)}
.pill{display:inline-block;padding:1px 8px;border-radius:9px;background:#e4e7eb;font-size:12px}
.state-QA_PASSED,.state-APPROVED,.state-MARKETING_READY,.st-done{background:#d7f0de}.state-QA_FAILED,.state-REJECTED,.st-failed{background:#f6d6d7}
.state-MANUAL_REVIEW,.st-running{background:#fdecc8}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
pre{white-space:pre-wrap;font-size:12px;background:#f0f2f4;padding:8px;border-radius:5px;max-height:300px;overflow:auto}
</style></head>
<body>
<header><a href="/">Puzzle Forge</a><a href="/new">Tạo sách</a><a href="/settings">Cài đặt</a><a href="/logout">Đăng xuất</a>
<span class="env pill env-{{ env }}">{{ version }}</span></header>
<main>{% block body %}{% endblock %}</main></body></html>

# AI routing (P10.3): every AI task picks provider + model + limits here — never in code.
# Override on the VM: copy to /etc/puzzle-forge/ai_routing.yaml (the web Settings page writes there).
# Models: pick from Settings -> AI Providers -> "Load models" (list fetched from each provider's API).
# temperature: omitted when null (current Claude models reject it; use effort instead).
# effort (Anthropic): low | medium | high | xhigh | max.
defaults:
  provider: anthropic
  model: claude-opus-5-5
  max_tokens: 16000
  effort: medium
  temperature: null
  fallback:                      # tried in order when the primary fails (network, refusal, bad JSON)
    - {provider: openai, model: gpt-5}
    - {provider: gemini, model: gemini-2.5-pro}

tasks:
  case_bible:            {effort: high, max_tokens: 32000}
  story:                 {effort: high, max_tokens: 32000}
  clues:                 {effort: high}
  word_list:             {model: claude-sonnet-5-5, effort: low}
  crossword_clues:       {model: claude-sonnet-5-5, effort: medium}
  content_plan:          {model: claude-sonnet-5-5, effort: medium}
  proofread:             {model: claude-sonnet-5-5, effort: low}
  playtest_reader_A:     {provider: anthropic, model: claude-opus-5-5, effort: high, fallback: []}
  playtest_reader_B:     {provider: openai, model: gpt-5, max_tokens: 32000,
                          fallback: [{provider: gemini, model: gemini-2.5-pro}]}   # must differ from A
  vision_qa:             {model: claude-opus-5-5, effort: medium}
  marketing_master_prompt: {model: claude-sonnet-5-5, effort: medium}
  image_prompt:          {model: claude-sonnet-5-5, effort: low}
  test_connection:       {model: claude-haiku-5-5, effort: low, max_tokens: 64, fallback: []}

# Cost control. USD; warn on Telegram at warn_ratio, refuse new calls at 100 %.
budget:
  daily_usd: 15
  monthly_usd: 150
  per_book_usd: 8
  warn_ratio: 0.8
budget_by_env:
  test: {daily_usd: 1, monthly_usd: 10, per_book_usd: 0.5}
  dev:  {daily_usd: 3, monthly_usd: 30, per_book_usd: 2}

cache:
  enabled: true                  # same task + model + prompt + schema + images -> reuse the answer
  ttl_days: 90
